syntax = "proto3";

message Request {
    string request_id = 1;
    string text = 2;
    int64 lenght = 3;
    repeated string provide = 4;
    int64 count_words = 5;
}

message Response {
    string request_id = 1;
    string text = 2;
    int64 lenght = 3;
    repeated string provide = 4;
    int64 count_words = 5;
    bool is_palindrome = 6;
}

service CSharpToPython {
    rpc GetCount(Request) returns (Response);
}